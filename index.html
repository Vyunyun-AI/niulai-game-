<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>牛来游戏 · 5合1</title>
<link rel="icon" href="data:,">
<style>
  :root{--accent:#ffd24a;--text:#e8e8f0;--blue:#1a5276;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0c0c18;
    font-family:"Microsoft YaHei",system-ui,sans-serif;color:var(--text);touch-action:none;}
  #wrap{position:relative;width:100vw;height:100vh;}
  canvas{display:block;position:absolute;inset:0;}
  /* 主菜单 */
  #menu{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;background:linear-gradient(160deg,#0c0c18,#1a1a3a 60%,#0c0c18);
    text-align:center;padding:20px;gap:18px;}
  #menu.hidden{display:none;}
  .logo{font-size:clamp(36px,7vw,72px);font-weight:900;letter-spacing:8px;
    color:var(--line2);text-shadow:0 4px 0 #b8860b,0 8px 30px rgba(255,215,0,.35);}
  .tagline{font-size:clamp(14px,2.5vw,22px);color:#cfd3e6;letter-spacing:4px;}
  .gameGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;max-width:800px;width:100%;margin-top:10px;}
  .gameCard{background:linear-gradient(180deg,#222244,#181830);border:2px solid rgba(255,215,0,.18);
    border-radius:16px;padding:18px 14px;cursor:pointer;transition:.18s;position:relative;overflow:hidden;}
  .gameCard:hover{border-color:rgba(255,215,0,.5);transform:translateY(-4px);
    box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 20px rgba(255,215,0,.1);}
  .gameCard:active{transform:translateY(0);}
  .gameIcon{font-size:48px;margin-bottom:8px;}
  .gameName{font-size:18px;font-weight:700;color:var(--line2);letter-spacing:1px;}
  .gameDesc{font-size:12px;color:#889;margin-top:6px;line-height:1.5;}
  .gameTag{position:absolute;top:8px;right:8px;font-size:10px;background:#333355;
    padding:2px 8px;border-radius:6px;color:#aab;}
  .gameTag.done{background:#2a5a2a;color:#7ee07e;}
  .footer{font-size:13px;color:#667;margin-top:6px;}
  /* 通用游戏内HUD */
  #hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;
    align-items:flex-start;padding:10px 16px;pointer-events:none;font-size:15px;
    text-shadow:0 2px 4px rgba(0,0,0,.8);}
  #hud.hidden{display:none;}
  .hudBox{background:rgba(18,18,36,.6);padding:7px 12px;border-radius:9px;
    border:1px solid rgba(255,215,0,.2);pointer-events:auto;}
  .hudBox .lab{font-size:11px;color:#aab;letter-spacing:1px;}
  .hudBox .val{font-size:18px;color:var(--line2);font-weight:700;}
  #btnBack{cursor:pointer;}
  #btnBack:hover{background:rgba(60,60,90,.7);}
  /* 暂停/结束/通关遮罩 */
  #overlay{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;
    align-items:center;justify-content:center;background:rgba(8,8,20,.7);text-align:center;gap:14px;}
  #overlay.show{display:flex;}
  #overlay .bigText{font-size:clamp(36px,8vw,80px);font-weight:900;letter-spacing:4px;}
  #overlay .go{color:#ff6b6b;}#overlay .win{color:#7ee07e;}
  #overlay .pause{color:var(--line2);}
  #overlay .score{font-size:22px;color:#ffe27a;}
  #overlay .msg{font-size:14px;color:#aab;line-height:1.8;}
  .btnRow{display:flex;gap:12px;margin-top:6px;}
  .btn{padding:12px 32px;font-size:18px;font-weight:700;color:#1a1a2e;
    background:linear-gradient(180deg,#ffe27a,#ffc93c);border:none;border-radius:10px;
    cursor:pointer;box-shadow:0 5px 0 #b8860b,0 8px 18px rgba(0,0,0,.4);transition:.12s;letter-spacing:2px;}
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(2px);box-shadow:0 3px 0 #b8860b;}
  .btn.sub{background:linear-gradient(180deg,#6a6a8a,#4a4a6a);color:#fff;box-shadow:0 5px 0 #2a2a4a;}
  /* 提示 */
  #tip{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:6;
    background:rgba(18,18,36,.8);padding:6px 16px;border-radius:8px;font-size:13px;color:#cdd;
    opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
  #tip.show{opacity:1;}
  /* 虚拟按键 */
  #touchUI{position:absolute;bottom:14px;left:0;right:0;z-index:6;display:none;
    justify-content:space-between;padding:0 16px;pointer-events:none;}
  #touchUI.show{display:flex;}
  #touchUI.hidden{display:none;}
  .vrow{display:flex;gap:5px;}
  .vbtn{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.13);
    border:2px solid rgba(255,255,255,.28);color:#fff;font-size:24px;display:flex;
    align-items:center;justify-content:center;pointer-events:auto;user-select:none;
    -webkit-tap-highlight-color:transparent;}
  .vbtn.fire{width:72px;height:72px;font-size:16px;font-weight:700;
    background:rgba(255,120,60,.3);border-color:rgba(255,180,120,.5);}
  .pad{display:flex;flex-direction:column;gap:5px;}
  .padRow{display:flex;gap:5px;justify-content:center;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hudBox" id="btnBack" onclick="goMenu()">← 返回</div>
    <div class="hudBox" style="text-align:center" id="hudCenter"></div>
    <div class="hudBox" style="text-align:right" id="hudRight"></div>
  </div>

  <!-- 遮罩 -->
  <div id="overlay">
    <div class="bigText" id="ovTitle"></div>
    <div class="score" id="ovScore"></div>
    <div class="msg" id="ovMsg"></div>
    <div class="btnRow">
      <button class="btn" id="ovBtn1" onclick="goMenu()">返回菜单</button>
      <button class="btn sub" id="ovBtn2">再来一次</button>
    </div>
  </div>

  <!-- 提示 -->
  <div id="tip"></div>

  <!-- 虚拟按键 -->
  <div id="touchUI">
    <div class="pad" id="touchLeft">
      <div class="padRow"><div class="vbtn" data-k="left">◀</div><div class="vbtn" data-k="right">▶</div></div>
      <div class="padRow"><div class="vbtn" data-k="down">▼</div><div class="vbtn" data-k="up">▲</div></div>
    </div>
    <div class="pad" id="touchRight">
      <div class="vbtn fire" data-k="shoot">开火</div>
    </div>
  </div>

  <!-- 主菜单 -->
  <div id="menu">
    <div class="logo">牛 来</div>
    <div class="tagline">5 合 1 游 戏 合 集</div>
    <div class="gameGrid">
      <div class="gameCard" onclick="startGame(0)">
        <div class="gameTag done">✓可玩</div>
        <div class="gameIcon">🔫</div>
        <div class="gameName">魂斗罗·牛来</div>
        <div class="gameDesc">横版卷轴射击<br>跑跳射击·大牛Boss</div>
      </div>
      <div class="gameCard" onclick="startGame(1)">
        <div class="gameTag done">✓可玩</div>
        <div class="gameIcon">🚀</div>
        <div class="gameName">打飞机·牛来</div>
        <div class="gameDesc">竖版弹幕射击<br>弹幕躲避·Boss战</div>
      </div>
      <div class="gameCard" onclick="startGame(2)">
        <div class="gameTag done">✓可玩</div>
        <div class="gameIcon">🐍</div>
        <div class="gameName">贪吃蛇·牛来</div>
        <div class="gameDesc">经典蛇身<br>越吃越长·撞墙即死</div>
      </div>
      <div class="gameCard" onclick="startGame(3)">
        <div class="gameTag done">✓可玩</div>
        <div class="gameIcon">🎪</div>
        <div class="gameName">马戏团·牛来</div>
        <div class="gameDesc">空中接物<br>顶碗·跳圈·走钢丝</div>
      </div>
      <div class="gameCard" onclick="startGame(4)">
        <div class="gameTag done">✓可玩</div>
        <div class="gameIcon">🥊</div>
        <div class="gameName">街霸·牛来</div>
        <div class="gameDesc">格斗对战<br>拳脚·必杀技·双人对战</div>
      </div>
    </div>
    <div class="footer">键盘 · 方向键移动 / W跳跃 / 空格射击 · P暂停 · 手机自动出虚拟键</div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   牛来游戏 · 5合1
   单文件 HTML · Canvas 渲染
   ============================================================ */
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',()=>{resize();if(currentGame&&currentGame.onResize)currentGame.onResize();});
resize();

/* ---------- 工具 ---------- */
const TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rand(a,b){return a+Math.random()*(b-a);}
function randi(a,b){return Math.floor(rand(a,b+1));}
function dist(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1);}
function lerp(a,b,t){return a+(b-a)*t;}

/* ---------- 输入 ---------- */
const keyIs={};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
  keyIs[k]=true;
  if(k==='p'&&currentGame&&currentGame.togglePause)currentGame.togglePause();
  if(k==='escape')goMenu();
});
window.addEventListener('keyup',e=>{keyIs[e.key.toLowerCase()]=false;});
window.addEventListener('blur',()=>{for(const k in keyIs)keyIs[k]=false;});
const vKeys={left:false,right:false,up:false,down:false,shoot:false,a:false,b:false};
const touchUI=document.getElementById('touchUI');
function isTouch(){return window.matchMedia('(pointer:coarse)').matches;}
function bindVBtn(btn){
  const k=btn.dataset.k;const set=v=>vKeys[k]=v;
  btn.addEventListener('touchstart',e=>{e.preventDefault();set(true);},{passive:false});
  btn.addEventListener('touchend',e=>{e.preventDefault();set(false);},{passive:false});
  btn.addEventListener('touchcancel',()=>set(false));
  btn.addEventListener('mousedown',()=>set(true));
  btn.addEventListener('mouseup',()=>set(false));
  btn.addEventListener('mouseleave',()=>set(false));
}
document.querySelectorAll('.vbtn').forEach(bindVBtn);
function showTouch(layout){
  touchUI.classList.add('show');
  touchUI.classList.remove('hidden');
  const tl=document.getElementById('touchLeft'),tr=document.getElementById('touchRight');
  tl.innerHTML='';tr.innerHTML='';
  if(layout==='arrows'){
    tl.innerHTML='<div class="padRow"><div class="vbtn" data-k="left">◀</div><div class="vbtn" data-k="right">▶</div></div><div class="padRow"><div class="vbtn" data-k="down">▼</div><div class="vbtn" data-k="up">▲</div></div>';
    tr.innerHTML='<div class="vbtn fire" data-k="shoot">开火</div>';
  }else if(layout==='dpad'){
    tl.innerHTML='<div class="padRow"><div class="vbtn" data-k="up">▲</div></div><div class="padRow"><div class="vbtn" data-k="left">◀</div><div class="vbtn" data-k="right">▶</div></div><div class="padRow"><div class="vbtn" data-k="down">▼</div></div>';
    tr.innerHTML='<div class="padRow"><div class="vbtn fire" data-k="shoot">A</div></div><div class="padRow"><div class="vbtn fire" data-k="b">B</div></div>';
  }else if(layout==='simple'){
    tl.innerHTML='<div class="padRow"><div class="vbtn" data-k="left">◀</div><div class="vbtn" data-k="right">▶</div></div>';
    tr.innerHTML='<div class="vbtn fire" data-k="shoot">跳</div>';
  }else if(layout==='fight'){
    tl.innerHTML='<div class="padRow"><div class="vbtn" data-k="left">◀</div><div class="vbtn" data-k="right">▶</div></div><div class="padRow"><div class="vbtn" data-k="up">▲</div><div class="vbtn" data-k="down">▼</div></div>';
    tr.innerHTML='<div class="padRow"><div class="vbtn fire" data-k="a">拳</div></div><div class="padRow"><div class="vbtn fire" data-k="b">踢</div></div><div class="padRow"><div class="vbtn fire" data-k="shoot">必杀</div></div>';
  }
  tl.querySelectorAll('.vbtn').forEach(bindVBtn);
  tr.querySelectorAll('.vbtn').forEach(bindVBtn);
}
function hideTouch(){touchUI.classList.remove('show');touchUI.classList.add('hidden');}
if(isTouch()){}else{hideTouch();}

/* ---------- 音效 ---------- */
let AC=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function beep(freq,dur,type='square',vol=.12,slide=0){
  try{const a=ac();if(a.state==='suspended')a.resume();
    const o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,a.currentTime);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),a.currentTime+dur);
    g.gain.setValueAtTime(vol,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+dur);
  }catch(e){}
}
const sfx={
  shoot:()=>beep(760,.08,'square',.09,-440),
  jump:()=>beep(300,.16,'triangle',.12,260),
  hit:()=>beep(180,.14,'sawtooth',.13,-80),
  die:()=>beep(240,.18,'square',.12,-160),
  pickup:()=>{beep(660,.1,'square',.12);setTimeout(()=>beep(990,.12,'square',.12),70);},
  boom:()=>{beep(90,.5,'sawtooth',.22,-60);setTimeout(()=>beep(55,.5,'sawtooth',.15,-25),60);},
  hurt:()=>beep(140,.3,'sawtooth',.18,-60),
  powerup:()=>{beep(520,.1);setTimeout(()=>beep(780,.1),100);setTimeout(()=>beep(1040,.14),200);},
  boss:()=>beep(200,.12,'sawtooth',.12,120),
  punch:()=>beep(120,.08,'sawtooth',.15,-50),
  kick:()=>beep(180,.1,'sawtooth',.13,60),
  special:()=>{beep(440,.08);setTimeout(()=>beep(660,.08),60);setTimeout(()=>beep(880,.12),120);},
  select:()=>{beep(440,.06);setTimeout(()=>beep(660,.06),50);},
};

/* ---------- 共享：牛来绘制 ---------- */
let cowAnimT=0;
function drawCow(x,y,facing,opts={}){
  const{running=false,shooting=false,jumping=false,flash=0,scale=1,hurt=false,sleeping=false}=opts;
  const s=scale;
  ctx.save();ctx.translate(x,y);ctx.scale(facing*s,s);
  if(flash>0)ctx.globalAlpha=.55+.45*Math.sin(flash*42);
  if(hurt)ctx.globalAlpha=.6;
  // 腿
  ctx.fillStyle='#caa860';
  const lift=running?Math.sin(cowAnimT*18)*6:(jumping?7:0);
  ctx.beginPath();ctx.ellipse(-7,16+lift,5.5,5,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(7,16-lift,5.5,5,0,0,TAU);ctx.fill();
  // 身体
  ctx.fillStyle='#f4cf6e';
  ctx.beginPath();ctx.ellipse(0,0,15,17,0,0,TAU);ctx.fill();
  ctx.fillStyle='#ffe9a8';
  ctx.beginPath();ctx.ellipse(0,7,9,9,0,0,TAU);ctx.fill();
  // 手臂
  ctx.fillStyle='#d9bd63';
  if(shooting){ctx.save();ctx.translate(9,-4);ctx.rotate(-.5);ctx.fillRect(0,-2,9,5);ctx.restore();}
  else{ctx.beginPath();ctx.ellipse(11,3,5,4,0,0,TAU);ctx.fill();}
  ctx.beginPath();ctx.ellipse(-10,4,4,3,0,0,TAU);ctx.fill();
  // 头
  ctx.fillStyle='#e8c45e';ctx.beginPath();ctx.arc(0,-15,12,0,TAU);ctx.fill();
  // 耳朵
  ctx.fillStyle='#d8b04e';
  ctx.beginPath();ctx.ellipse(-10,-19,4,6,-.6,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(10,-19,4,6,.6,0,TAU);ctx.fill();
  // 牛角
  ctx.fillStyle='#5a3b2a';
  ctx.beginPath();ctx.moveTo(-7,-23);ctx.quadraticCurveTo(-12,-32,-8,-35);
  ctx.quadraticCurveTo(-5,-29,-3,-24);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(7,-23);ctx.quadraticCurveTo(12,-32,8,-35);
  ctx.quadraticCurveTo(5,-29,3,-24);ctx.closePath();ctx.fill();
  // 口鼻
  ctx.fillStyle='#b99ac8';ctx.beginPath();ctx.ellipse(0,-10,6,5,0,0,TAU);ctx.fill();
  // 表情
  ctx.strokeStyle='#3a2a1a';ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-7,-21);ctx.lineTo(-2,-19);ctx.stroke();
  ctx.beginPath();ctx.moveTo(7,-21);ctx.lineTo(2,-19);ctx.stroke();
  ctx.fillStyle='#1a1a1a';
  if(sleeping){
    ctx.strokeStyle='#1a1a1a';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(-4.5,-14,3,0,Math.PI);ctx.stroke();
    ctx.beginPath();ctx.arc(4.5,-14,3,0,Math.PI);ctx.stroke();
  }else{
    ctx.beginPath();ctx.ellipse(-4.5,-14,2.2,1.4,0,0,TAU);ctx.fill();
    ctx.beginPath();ctx.ellipse(4.5,-14,2.2,1.4,0,0,TAU);ctx.fill();
  }
  ctx.strokeStyle='#5a3b2a';
  ctx.beginPath();ctx.arc(0,-8,3.4,.5*Math.PI,1.25*Math.PI);ctx.stroke();
  ctx.restore();
}
function drawCowMini(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#f4cf6e';ctx.beginPath();ctx.ellipse(0,0,12,14,0,0,TAU);ctx.fill();
  ctx.fillStyle='#e8c45e';ctx.beginPath();ctx.arc(0,-12,10,0,TAU);ctx.fill();
  ctx.fillStyle='#5a3b2a';
  ctx.beginPath();ctx.moveTo(-6,-20);ctx.lineTo(-9,-26);ctx.lineTo(-3,-21);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(6,-20);ctx.lineTo(9,-26);ctx.lineTo(3,-21);ctx.closePath();ctx.fill();
  ctx.fillStyle='#b99ac8';ctx.beginPath();ctx.ellipse(0,-8,5,4,0,0,TAU);ctx.fill();
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath();ctx.ellipse(-3.5,-11,1.8,1.2,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(3.5,-11,1.8,1.2,0,0,TAU);ctx.fill();
  ctx.restore();
}

/* ---------- UI 管理 ---------- */
const menuEl=document.getElementById('menu');
const hudEl=document.getElementById('hud');
const hudCenter=document.getElementById('hudCenter');
const hudRight=document.getElementById('hudRight');
const overlayEl=document.getElementById('overlay');
const ovTitle=document.getElementById('ovTitle');
const ovScore=document.getElementById('ovScore');
const ovMsg=document.getElementById('ovMsg');
const ovBtn1=document.getElementById('ovBtn1');
const ovBtn2=document.getElementById('ovBtn2');
const tipEl=document.getElementById('tip');
let tipT=0,tipMsg='';
function tip(msg){tipMsg=msg;tipT=2.5;tipEl.textContent=msg;tipEl.classList.add('show');}
function updateTip(){if(tipT>0){tipT-=1/60;if(tipT<=0)tipEl.classList.remove('show');}}
function showOverlay(title,cls,score,msg,btn2text,btn2cb){
  ovTitle.textContent=title;ovTitle.className='bigText '+cls;
  ovScore.textContent=score?('得分：'+score):'';
  ovMsg.innerHTML=msg||'';
  ovBtn2.textContent=btn2text||'再来一次';
  ovBtn2.onclick=btn2cb||(()=>{hideOverlay();if(currentGame&&currentGame.restart)currentGame.restart();});
  overlayEl.classList.add('show');
}
function hideOverlay(){overlayEl.classList.remove('show');}
function showHUD(c,r){hudEl.classList.remove('hidden');hudCenter.innerHTML=c||'';hudRight.innerHTML=r||'';}
function hideHUD(){hudEl.classList.add('hidden');}
function goMenu(){
  if(running)running=false;
  hideOverlay();hideHUD();hideTouch();
  menuEl.classList.remove('hidden');
  currentGame=null;
}

/* ---------- 游戏框架 ---------- */
let currentGame=null;
let running=false;
let lastTime=0;
function startGame(idx){
  ac();sfx.select();
  menuEl.classList.add('hidden');
  currentGame=games[idx];
  hideOverlay();
  if(currentGame.init)currentGame.init();
  running=true;lastTime=performance.now();
  requestAnimationFrame(gameLoop);
}
function gameLoop(now){
  if(!running)return;
  const dt=clamp((now-lastTime)/1000,0,0.033);lastTime=now;
  cowAnimT+=dt;updateTip();
  if(currentGame){
    currentGame.update(dt);
    currentGame.draw();
  }
  requestAnimationFrame(gameLoop);
}

/* ---------- 5 个游戏 ---------- */
const games=[];

/* ============================================================
   游戏1：魂斗罗·牛来（横版射击）
   ============================================================ */
games[0]=function(){
  let state='playing',score=0,stage=1,hp=3,runT=0;
  let player,platforms,bullets,ebullets,enemies,powerups,particles,boss,camX,stageAt,lastBoss;
  const STAGE_LEN=3,STAGE_PLATS=[8,10,12];
  const GY=()=>H*0.82;
  function reset(){
    player={x:140,y:GY()-30,vx:0,vy:0,onGround:true,face:1,weapon:'gun',wlevel:1,invul:0,fireCd:0,dead:false,running:false,shooting:false};
    score=0;stage=1;hp=3;camX=0;

/* ============================================================
   游戏3：贪吃蛇·牛来

games[2]=function(){

  function reset(){

  }

  return {

    restart(){reset();state='playing';hideOverlay();updHUD();},
    togglePause(){if(state==='playing'){state='paused';showOverlay('⏸ 暂停','pause','','按 P 或点击继续','继续',()=>{state='playing';hideOverlay();});}else if(state==='paused'){state='playing';hideOverlay();}},
    update(dt){
      if(state!=='playing')return;
      const L=keyIs['arrowleft']||keyIs['a']||vKeys.left,R=keyIs['arrowright']||keyIs['d']||vKeys.right,U=keyIs['arrowup']||keyIs['w']||vKeys.up,Dn=keyIs['arrowdown']||keyIs['s']||vKeys.down;
      if(L&&dir.x===0)nextDir={x:-1,y:0};if(R&&dir.x===0)nextDir={x:1,y:0};if(U&&dir.y===0)nextDir={x:0,y:-1};if(Dn&&dir.y===0)nextDir={x:0,y:1};

        else{ctx.fillStyle=i%2?'#f4cf6e':'#e8c45e';ctx.beginPath();ctx.arc(sx,sy,cell*0.35,0,TAU);ctx.fill();
          ctx.fillStyle='#5a3b2a';ctx.beginPath();ctx.arc(sx-cell*0.2,sy-cell*0.2,2,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(sx+cell*0.2,sy-cell*0.2,2,0,TAU);ctx.fill();}
      }
    },

/* ============================================================

games[3]=function(){

  }

  function updHUD(){showHUD('<div class="lab">HP</div><div style="color:#ff6b6b">'+'♥'.repeat(Math.max(0,hp))+'</div>','<div class="lab">得分</div><div class="val">'+score+'</div>');}
  function hurt(){if(player.catching>0)return;hp--;sfx.hurt();spawnBits(player.x,player.y,8);updHUD();if(hp<=0){state='over';showOverlay('表 演 失 败','go',score,'牛来从钢丝上掉下来了…','重新开始',()=>{reset();state='playing';hideOverlay();updHUD();});}}
  return {
    state:null,init(){if(isTouch())showTouch('simple');reset();state='playing';updHUD();tip('←→保持平衡·空格跳跃接物！');},
    restart(){reset();state='playing';hideOverlay();updHUD();},
    togglePause(){if(state==='playing'){state='paused';showOverlay('⏸ 暂停','pause','','按 P 或点击继续','继续',()=>{state='playing';hideOverlay();});}else if(state==='paused'){state='playing';hideOverlay();}},
    update(dt){
      if(state!=='playing')return;
      timer+=dt;
      const L=keyIs['arrowleft']||keyIs['a']||vKeys.left,R=keyIs['arrowright']||keyIs['d']||vKeys.right,Jp=keyIs[' ']||keyIs['w']||keyIs['arrowup']||vKeys.shoot;
      // 钢丝平衡
      player.balance+=dt*0.5*(L?-1:R?1:0);
      player.balance+=dt*0.3*Math.sin(timer*1.5);
      player.balance=clamp(player.balance,-3,3);
      player.x+=player.vx*dt;
      if(!player.jumping){player.vx=lerp(player.vx,-player.balance*40,dt*2);player.vx=clamp(player.vx,-120,120);}
      else{player.x+=player.vx*dt;player.y+=player.jumpVy*dt;player.jumpVy+=600*dt;if(player.y>=H*0.5){player.y=H*0.5;player.jumping=false;player.jumpVy=0;}}
      player.x=clamp(player.x,60,W-60);

      if(Math.abs(player.balance)>2.8){hurt();player.balance=0;}

        const kind=randi(0,2);

      }

        if(o.y>H+40)objects.splice(i,1);
      }
      for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;if(p.life<=0)particles.splice(i,1);}

      // 物体

        else if(o.kind===1){ctx.strokeStyle='#4ec3ff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,14,0,TAU);ctx.stroke();}
        else{ctx.fillStyle='#ffd166';ctx.beginPath();for(let j=0;j<5;j++){const a=j*TAU/5-Math.PI/2;ctx.lineTo(Math.cos(a)*14,Math.sin(a)*14);ctx.lineTo(Math.cos(a+TAU/10)*7,Math.sin(a+TAU/10)*7);}ctx.closePath();ctx.fill();}
        ctx.restore();
      }
      // 平衡指示器
      ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,H*0.5+25,30,0,TAU);ctx.stroke();
      ctx.fillStyle=player.balance>1.5||player.balance<-1.5?'#ff6b6b':'#7ee07e';
      ctx.beginPath();ctx.arc(player.x+player.balance*8,H*0.5+25,5,0,TAU);ctx.fill();

      drawCow(0,0,1,{running:false,jumping:player.jumping,shooting:false,scale:1});
      ctx.restore();
      // 粒子
      for(const p of particles){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}ctx.globalAlpha=1;
    },

/* ============================================================
   游戏5：街头霸王·牛来（格斗对战）

games[4]=function(){
  let state='playing',score=0,hp1,hp2,p1,p2,timer,rounds,p1Win,p2Win;
  const GY=()=>H*0.85;
  function reset(){
    p1={x:W*0.3,y:GY(),vx:0,vy:0,face:1,hp:100,atkCd:0,hitCd:0,anim:0,action:'idle',special:0};
    p2={x:W*0.7,y:GY(),vx:0,vy:0,face:-1,hp:100,atkCd:0,hitCd:0,anim:0,action:'idle',special:0};
    hp1=100;hp2=100;timer=0;rounds=1;p1Win=0;p2Win=0;score=0;
  }
  function spawnBits(x,y,n){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-200,200),vy:rand(-200,-30),life:rand(.3,.6),c:['#ffd166','#ff9d4d','#ff5b5b'][randi(0,2)],r:rand(2,5)});}
  let particles=[];
  function updHUD(){showHUD('<div class="lab">牛来 HP</div><div style="width:120px;height:14px;background:#3a2a2a;border-radius:7px;overflow:hidden"><div style="height:100%;width:'+hp1+'%;background:linear-gradient(90deg,#ff5b5b,#ff9d4d);transition:.2s"></div></div>','<div class="lab">大牛 HP</div><div style="width:120px;height:14px;background:#3a2a2a;border-radius:7px;overflow:hidden"><div style="height:100%;width:'+hp2+'%;background:linear-gradient(90deg,#5b5bff,#9d4dff);transition:.2s;float:right"></div></div>');}
  function doAttack(attacker,defender,type){
    if(attacker.atkCd>0||attacker.hitCd>0)return;
    attacker.atkCd=type==='punch'?0.4:type==='kick'?0.6:1.2;
    attacker.action=type;attacker.anim=0;
    const range=type==='punch'?45:type==='kick'?60:80;
    const dmg=type==='punch'?5:type==='kick'?8:18;
    const dx=Math.abs(attacker.x-defender.x);
    if(dx<range&&Math.abs(attacker.y-defender.y)<50&&attacker.face===(defender.x>attacker.x?1:-1)){
      defender.hp=Math.max(0,defender.hp-dmg);defender.hitCd=0.3;defender.vx=attacker.face*150;
      sfx[type==='special'?'special':'punch']();spawnBits(defender.x,defender.y-30,6);
      if(type==='special')sfx.special();
      if(defender===p2)hp2=defender.hp;else hp1=defender.hp;updHUD();
      if(defender.hp<=0){endRound(defender===p2);}
    }

  function endRound(p2Lost){

    if(p1Win>=2||p2Win>=2){state=p1Win>=2?'win':'over';showOverlay(p1Win>=2?'🎉 牛来获胜！':'牛 来 战 败',p1Win>=2?'win':'go',score,p1Win>=2?'牛来是街头最强的格斗家！':'别灰心，再战一局！','再来一局',()=>{reset();state='playing';hideOverlay();updHUD();});}
    else{p1.hp=100;p2.hp=100;hp1=100;hp2=100;p1.x=W*0.3;p2.x=W*0.7;p1.y=p2.y=GY();rounds++;tip('第'+rounds+'回合！');updHUD();}
  }
  return {
    state:null,init(){if(isTouch())showTouch('fight');reset();state='playing';updHUD();tip('A拳·B踢·必杀技(空格)·←→移动');},
    restart(){reset();state='playing';hideOverlay();updHUD();},
    togglePause(){if(state==='playing'){state='paused';showOverlay('⏸ 暂停','pause','','按 P 或点击继续','继续',()=>{state='playing';hideOverlay();});}else if(state==='paused'){state='playing';hideOverlay();}},
    update(dt){
      if(state!=='playing')return;
      timer+=dt;
      const L=keyIs['arrowleft']||keyIs['a']||vKeys.left,R=keyIs['arrowright']||keyIs['d']||vKeys.right,U=keyIs['arrowup']||keyIs['w']||vKeys.up,Pn=keyIs['j']||vKeys.a,Kk=keyIs['k']||vKeys.b,Sp=keyIs[' ']||vKeys.shoot;
      // P1
      p1.face=p2.x>p1.x?1:-1;
      p1.vx=(R?200:0)-(L?200:0);if(p1.onGround&&U){p1.vy=-420;sfx.jump();}
      p1.vy+=900*dt;p1.x+=p1.vx*dt;p1.y+=p1.vy*dt;

      p1.x=clamp(p1.x,40,W*0.6);
      if(Pn)doAttack(p1,p2,'punch');else if(Kk)doAttack(p1,p2,'kick');else if(Sp&&p1.special<=0)doAttack(p1,p2,'special');
      if(p1.atkCd>0)p1.atkCd-=dt;if(p1.hitCd>0)p1.hitCd-=dt;p1.anim+=dt;

      else if(dx>80){p2.vx=p2.face*150;p2.x+=p2.vx*dt;}
      else{p2.vx=lerp(p2.vx,0,dt*5);if(p2.atkCd<=0){const r=Math.random();if(r<0.4)doAttack(p2,p1,'punch');else if(r<0.7)doAttack(p2,p1,'kick');else if(r<0.85&&p2.special<=0)doAttack(p2,p1,'special');}}
      p2.x=clamp(p2.x,W*0.4,W-40);
      p2.vy+=900*dt;p2.y+=p2.vy*dt;if(p2.y>GY()){p2.y=GY();p2.vy=0;}
      if(p2.atkCd>0)p2.atkCd-=dt;if(p2.hitCd>0)p2.hitCd-=dt;p2.anim+=dt;
      if(p2.action!=='idle'&&p2.atkCd<=0)p2.action='idle';
      if(p1.hitCd>0)p1.x+=p1.vx*dt*0.5;
      // 粒子
      for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;if(p.life<=0)particles.splice(i,1);}
    },
    draw(){
      const gy=GY();
      // 背景：街头
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a1a2e');g.addColorStop(.6,'#2a2a3e');g.addColorStop(1,'#1a1a1a');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      // 建筑
      for(let i=0;i<6;i++){ctx.fillStyle='#2a2a3a';ctx.fillRect(i*W/6,gy-200+Math.sin(i)*30,W/6-4,200);ctx.fillStyle='rgba(255,215,0,.15)';for(let j=0;j<4;j++)ctx.fillRect(i*W/6+10+j*20,gy-180+Math.sin(i)*30,8,8);}
      // 地面
      ctx.fillStyle='#333';ctx.fillRect(0,gy,W,H-gy);
      ctx.fillStyle='#444';ctx.fillRect(0,gy,W,4);
      // P1
      ctx.save();ctx.translate(p1.x,p1.y);ctx.scale(p1.face,1);
      const p1act=p1.action;drawCow(0,0,1,{running:p1.vx!==0&&Math.abs(p1.vx)>10,shooting:p1act==='punch'||p1act==='kick'||p1act==='special',jumping:p1.y<gy,flash:p1.hitCd>0?2:0,hurt:p1.hitCd>0});
      if(p1act==='punch'||p1act==='kick'){ctx.fillStyle='#ff5b5b';ctx.globalAlpha=.4;ctx.beginPath();ctx.arc(22,-10,12,0,TAU);ctx.fill();ctx.globalAlpha=1;}
      if(p1act==='special'){ctx.fillStyle='#ffd166';ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(28,-10,22,0,TAU);ctx.fill();ctx.globalAlpha=1;}
      ctx.restore();
      // P2（大牛，紫版）
      ctx.save();ctx.translate(p2.x,p2.y);ctx.scale(p2.face,1);
      // 大牛绘制（紫色版）
      ctx.fillStyle='#6a4a8a';ctx.beginPath();ctx.ellipse(0,0,18,20,0,0,TAU);ctx.fill();
      ctx.fillStyle='#8a6aaa';ctx.beginPath();ctx.ellipse(0,7,12,12,0,0,TAU);ctx.fill();
      ctx.fillStyle='#5a3a7a';ctx.beginPath();ctx.arc(0,-16,13,0,TAU);ctx.fill();
      ctx.fillStyle='#caa860';ctx.beginPath();ctx.moveTo(-8,-24);ctx.lineTo(-13,-34);ctx.lineTo(-4,-26);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(8,-24);ctx.lineTo(13,-34);ctx.lineTo(4,-26);ctx.closePath();ctx.fill();
      ctx.fillStyle='#b99ac8';ctx.beginPath();ctx.ellipse(0,-11,6,5,0,0,TAU);ctx.fill();
      ctx.strokeStyle='#3a2a1a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-8,-22);ctx.lineTo(-3,-20);ctx.stroke();ctx.beginPath();ctx.moveTo(8,-22);ctx.lineTo(3,-20);ctx.stroke();
      ctx.fillStyle='#ff3333';ctx.beginPath();ctx.ellipse(-5,-15,2.5,1.8,0,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(5,-15,2.5,1.8,0,0,TAU);ctx.fill();
      ctx.strokeStyle='#5a3b2a';ctx.beginPath();ctx.arc(0,-9,3.4,.5*Math.PI,1.25*Math.PI);ctx.stroke();
      if(p2.action==='punch'||p2.action==='kick'){ctx.fillStyle='#ff5b5b';ctx.globalAlpha=.4;ctx.beginPath();ctx.arc(22,-10,12,0,TAU);ctx.fill();ctx.globalAlpha=1;}
      if(p2.action==='special'){ctx.fillStyle='#9d4dff';ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(28,-10,22,0,TAU);ctx.fill();ctx.globalAlpha=1;}
      if(p2.hitCd>0)ctx.globalAlpha=.6;
      ctx.restore();
      // 回合显示
      if(rounds>1||p1Win>0||p2Win>0){ctx.fillStyle='rgba(255,215,0,.6)';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('第'+rounds+'回合  牛来 '+p1Win+' : '+p2Win+' 大牛',W/2,30);}
      // 粒子
      for(const p of particles){ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}ctx.globalAlpha=1;
    },
    onResize(){p1.y=GY();p2.y=GY();},
  };
}();

/* ---------- 启动 ---------- */
</script>
